name: Security controls CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'ops/security-headers.conf'
      - 'site/commerce/assets/common.js'
      - 'tests/security-*'
      - 'tests/p9-sales-smoke.php'
      - '.github/workflows/security-controls-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bois_security_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BOIS_P3_TEST_DB_HOST: 127.0.0.1
      BOIS_P3_TEST_DB_PORT: 3306
      BOIS_P3_TEST_DB_NAME: bois_security_test
      BOIS_P3_TEST_DB_USER: root
      BOIS_P3_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: |
          php -l server/security.php
          php -l tests/security-hardening-smoke.php
          php -l server/p8_stripe.php
          php -l server/p9_sales.php
          php -l server/consent.php
          php -l server/commerce-api.php
          php -l tests/security-checkout-gate-smoke.php
          php -l tests/security-http-gates-smoke.php
          php -l tests/p9-sales-smoke.php
          node --check site/commerce/assets/common.js
      - name: P10 early HTTP protection and atomic abuse limits
        run: php -d disable_functions=curl_init,curl_exec,mail tests/security-hardening-smoke.php
      - name: Checkout gate without a database or external transport
        run: php -d disable_functions=curl_init,curl_exec,mail tests/security-checkout-gate-smoke.php
      - name: Browser storage and event guards without external requests
        run: node --test tests/security-browser-gates.test.cjs
      - name: P9 regression and real loopback HTTP gate tests
        run: php -d disable_functions=curl_init,curl_exec,mail tests/security-http-gates-smoke.php
