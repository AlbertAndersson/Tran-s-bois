name: P7 Assortment CI

on:
  push:
    branches: [main, "chatgpt/**"]
    paths:
      - "server/p7_*.php"
      - "server/p7-migrate.php"
      - "server/p3_db.php"
      - "tests/p7-*.php"
      - "data/p7-assortment.json"
      - "site/commerce/assortment-preview.html"
      - "site/commerce/index.html"
      - "site/commerce/assets/assortment-preview.js"
      - "site/commerce/assets/admin.js"
      - ".github/workflows/p7-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bois_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BOIS_P3_TEST_DB_HOST: 127.0.0.1
      BOIS_P3_TEST_DB_PORT: 3306
      BOIS_P3_TEST_DB_NAME: bois_test
      BOIS_P3_TEST_DB_USER: root
      BOIS_P3_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - name: PHP syntax and model
        run: |
          php -l server/p7_assortment.php
          php -l server/p7-migrate.php
          php -l tests/p7-model-smoke.php
          php -l tests/p7-gate-smoke.php
          php -l server/p3_db.php
          php -l server/commerce-api.php
          php tests/p7-model-smoke.php
      - name: P3–P6 and P7 gate on isolated MySQL 8.4 databases
        shell: bash
        run: |
          set -euo pipefail
          for phase in p3 p4 p5 p6 p7-gate; do
            export BOIS_P3_TEST_DB_NAME="bois_${phase//-/_}"
            php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306", "root", "root"); $pdo->exec("CREATE DATABASE `".getenv("BOIS_P3_TEST_DB_NAME")."`");'
            php "tests/${phase}-smoke.php"
          done
      - name: JSON and JavaScript syntax
        run: |
          python3 -m json.tool data/p7-assortment.json >/dev/null
          node --check site/commerce/assets/admin.js
          node --check site/commerce/assets/assortment-preview.js
          grep -q "payment_provider.*mock" server/p3-config.example.php
          grep -q "mail_transport.*disabled" server/p3-config.example.php
      - name: Public landing page does not expose proposed merch
        run: |
          ! grep -Eiq 'BoIS 1941 Hoodie|Supporter-T-shirt|Bandyförälder Hoodie|Mössa \+ halsduk|Gym Pack|Knatte Pack|Presentkort|BoIS Läktarmössa' site/commerce/index.html
          grep -q 'mock/testprovider' site/commerce/index.html
