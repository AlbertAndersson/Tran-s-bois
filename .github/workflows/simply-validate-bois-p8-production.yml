name: Simply - validate Tranås BoIS closed production readiness

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Skriv VALIDATE_CLOSED_BOIS_PRODUCTION'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event.inputs.confirm == 'VALIDATE_CLOSED_BOIS_PRODUCTION'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROD_DB_HOST: ${{ secrets.BOIS_PROD_DB_HOST }}
      PROD_DB_NAME: ${{ secrets.BOIS_PROD_DB_NAME }}
      PROD_DB_USER: ${{ secrets.BOIS_PROD_DB_USER }}
      PROD_DB_PASSWORD: ${{ secrets.BOIS_PROD_DB_PASSWORD }}
      PROD_DB_PORT: ${{ vars.BOIS_PROD_DB_PORT }}
      PROD_ADMIN_TOKEN: ${{ secrets.BOIS_PROD_ADMIN_TOKEN }}
      STAGING_DB_HOST: ${{ secrets.BOIS_DB_HOST }}
      STAGING_DB_NAME: ${{ secrets.BOIS_DB_NAME }}
      STAGING_DB_USER: ${{ secrets.BOIS_DB_USER }}
    steps:
      - uses: actions/checkout@v5
      - name: Closed production secret inventory without values or live Stripe credentials
        shell: bash
        run: |
          set -euo pipefail
          blocked=0
          for suffix in HOST NAME USER PASSWORD; do
            name="PROD_DB_$suffix"
            if [[ -z "${!name}" ]]; then
              echo "MISSING_SECRET: BOIS_PROD_DB_$suffix"
              blocked=1
            fi
          done
          if [[ ${#PROD_ADMIN_TOKEN} -lt 32 ]]; then
            echo "MISSING_SECRET: BOIS_PROD_ADMIN_TOKEN"
            blocked=1
          fi
          echo "SECRETS_EXPOSED: no"
          echo "STRIPE_LIVE_CREDENTIALS_READ: no"
          echo "EXTERNAL_FUNCTIONS_ACTIVATED: no"
          [[ "$blocked" == 0 ]] || { echo "::error::Closed production credentials unavailable; no database connection attempted"; exit 1; }
          [[ -n "$STAGING_DB_HOST" && -n "$STAGING_DB_NAME" && -n "$STAGING_DB_USER" ]]
          [[ "${PROD_DB_NAME,,}" != "${STAGING_DB_NAME,,}" ]]
          [[ "${PROD_DB_USER,,}" != "${STAGING_DB_USER,,}" ]]
      - name: Build private closed config with no secret output
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          php -r '
          $c=require "server/production-config.example.php";
          $c["admin_token"]=getenv("PROD_ADMIN_TOKEN");
          $c["db"]=["host"=>getenv("PROD_DB_HOST"),"port"=>(int)(getenv("PROD_DB_PORT")?:3306),"database"=>getenv("PROD_DB_NAME"),"user"=>getenv("PROD_DB_USER"),"password"=>getenv("PROD_DB_PASSWORD")];
          $c["staging_db_identity"]=["host"=>getenv("STAGING_DB_HOST"),"database"=>getenv("STAGING_DB_NAME"),"user"=>getenv("STAGING_DB_USER")];
          file_put_contents(getenv("RUNNER_TEMP")."/bois-prod-closed.php","<?php return ".var_export($c,true).";");'
      - name: Read-only closed readiness - no bootstrap or deployment
        shell: bash
        run: |
          set -euo pipefail
          php ops/p12-readiness.php "$RUNNER_TEMP/bois-prod-closed.php" | tee "$RUNNER_TEMP/readiness.txt"
          cat "$RUNNER_TEMP/readiness.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup private config
        if: always()
        run: rm -f "$RUNNER_TEMP/bois-prod-closed.php" "$RUNNER_TEMP/readiness.txt"
