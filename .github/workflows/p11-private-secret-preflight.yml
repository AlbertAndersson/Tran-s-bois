name: P11 private sandbox secret preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      STRIPE_TEST_API_KEY: ${{ secrets.BOIS_STRIPE_TEST_API_KEY }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.BOIS_STRIPE_TEST_WEBHOOK_SECRET }}
    steps:
      - name: Verify restricted test key and separate signing secret
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STRIPE_TEST_API_KEY" == rk_test_* ]] || { echo "::error::P11 requires a restricted test key"; exit 1; }
          [[ "$STRIPE_TEST_WEBHOOK_SECRET" == whsec_* && ${#STRIPE_TEST_WEBHOOK_SECRET} -ge 16 ]]
          echo "STRIPE_KEY_CLASS: restricted_test"
          echo "STRIPE_SIGNING_SECRET: configured"
          echo "LIVE_STRIPE_CALLS: no"
          echo "SECRET_VALUES_EXPOSED: no"
